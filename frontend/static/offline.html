<!doctype html>
<!--
  Served by the service worker (static/sw.js) when a page navigation fails
  because the device is offline. It is precached at install, so it must be
  fully self-contained: inline styles, no app bundle, no i18n runtime (the
  copy is in both English and Arabic for that reason), and no instance name
  (each instance brands itself; this file is shared).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#6c3edd">
  <title>Offline · غير متصل</title>
  <style>
    /* Mirrors the app's tokens in src/app.css (light :root and the designed
       dark ramp); this page can't load that stylesheet offline. */
    :root {
      --bg: #f8fafb;
      --surface: #ffffff;
      --text: #191c1d;
      --muted: #3d4949;
      --brand: #6c3edd;
      --on-brand: #ffffff;
      --border: rgba(188, 201, 200, 0.45);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0f15;
        --surface: #1c1d27;
        --text: #f6f5fb;
        --muted: #aeb0c2;
        --brand: #8b5cf6;
        --border: rgba(202, 200, 230, 0.14);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Arabic', Tahoma, sans-serif;
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      text-align: center;
    }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { margin: 20px 0 4px; font-size: 1.25rem; }
    p { margin: 0 0 4px; color: var(--muted); }
    .ar { margin-top: 16px; }
    .ar h1 { margin-top: 0; }
    button {
      margin-top: 24px;
      min-height: 44px;
      padding: 10px 28px;
      border: 0;
      border-radius: 999px;
      background: var(--brand);
      color: var(--on-brand);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <section lang="en" dir="ltr">
      <h1>You're offline</h1>
      <p>Check your connection. This page will reload by itself once you're back online.</p>
    </section>
    <section class="ar" lang="ar" dir="rtl">
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>تحقّق من اتصالك. ستُعاد هذه الصفحة تلقائياً عند عودة الاتصال.</p>
    </section>
    <button type="button" id="retry">Try again · إعادة المحاولة</button>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', function () {
      location.reload();
    });
    window.addEventListener('online', function () {
      location.reload();
    });
  </script>
</body>
</html>
